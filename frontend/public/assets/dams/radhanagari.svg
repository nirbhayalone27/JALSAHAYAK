<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="sky-radhanagari" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="60%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="water-radhanagari" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="dam-wall-radhanagari" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="downstream-radhanagari" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow-radhanagari" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="600" height="320" fill="url(#sky-radhanagari)"/>

  <!-- Distant Sahyadri Mountain Ridge (Western Ghats) -->
  <path d="M0,170 Q70,125 150,150 T310,135 T470,145 T600,130 L600,320 L0,320 Z" fill="#94a3b8" opacity="0.35"/>
  <path d="M0,185 Q90,145 200,165 T420,150 T600,160 L600,320 L0,320 Z" fill="#64748b" opacity="0.25"/>

  <!-- Upstream Reservoir Water -->
  <path d="M0,195 Q140,190 270,192 L270,295 L0,295 Z" fill="url(#water-radhanagari)"/>
  <!-- Reservoir Ripple lines -->
  <path d="M20,210 Q90,207 180,210" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="12,6" fill="none" opacity="0.6"/>
  <path d="M40,228 Q120,225 220,228" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="16,8" fill="none" opacity="0.5"/>
  <path d="M10,248 Q100,245 240,248" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="20,10" fill="none" opacity="0.4"/>

  <!-- Dam Structure -->
  
  <!-- Concrete Gravity Dam Profile -->
  <polygon points="255,295 265,170 330,170 410,295" fill="url(#dam-wall-radhanagari)" filter="url(#shadow-radhanagari)"/>
  <!-- Dam Crest Roadway -->
  <rect x="260" y="166" width="74" height="8" rx="2" fill="#334155"/>
  <!-- Spillway Piers & Radial Gates -->
  <rect x="320" y="174" width="9" height="20" fill="#1e293b"/>
  <rect x="336" y="174" width="9" height="20" fill="#1e293b"/>
  <rect x="352" y="174" width="9" height="20" fill="#1e293b"/>
  <rect x="368" y="174" width="9" height="20" fill="#1e293b"/>
  <!-- Radial Gate curves -->
  <path d="M329,186 Q333,190 336,186" stroke="#ef4444" stroke-width="2" fill="none"/>
  <path d="M345,186 Q349,190 352,186" stroke="#ef4444" stroke-width="2" fill="none"/>
  <path d="M361,186 Q365,190 368,186" stroke="#ef4444" stroke-width="2" fill="none"/>
  <!-- Concrete chute training wall -->
  <line x1="330" y1="170" x2="410" y2="295" stroke="#1e293b" stroke-width="2"/>
  <!-- Chute aeration steps -->
  <line x1="340" y1="205" x2="375" y2="205" stroke="#475569" stroke-width="1"/>
  <line x1="355" y1="235" x2="390" y2="235" stroke="#475569" stroke-width="1"/>
  <line x1="370" y1="265" x2="405" y2="265" stroke="#475569" stroke-width="1"/>
  

  <!-- Downstream River Flow / Stilling Basin -->
  <path d="M385,290 Q440,285 600,288 L600,320 L360,320 Z" fill="url(#downstream-radhanagari)"/>
  <path d="M400,296 Q480,292 600,296" stroke="#ffffff" stroke-width="2" stroke-dasharray="24,12" fill="none" opacity="0.7"/>

  <!-- Ground / Valley Banks -->
  <path d="M0,290 L250,290 L240,320 L0,320 Z" fill="#334155"/>
  <path d="M410,295 L600,295 L600,320 L400,320 Z" fill="#1e293b"/>

  <!-- Top Glass Identification Badge -->
  <rect x="16" y="16" width="320" height="68" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
  
  <!-- Tricolour micro accent on badge -->
  <rect x="28" y="26" width="5" height="48" rx="2" fill="#FF9933"/>
  <rect x="28" y="42" width="5" height="16" fill="#FFFFFF"/>
  <rect x="28" y="58" width="5" height="16" fill="#138808"/>

  <text x="42" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Radhanagari Dam (Laxmi Talao)</text>
  <text x="42" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Bhogawati • Kolhapur, Maharashtra</text>
  <text x="42" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Gravity masonry  |  Ht: 42 m  |  Est: 1957</text>

  <!-- Water Level Marker on Reservoir Side -->
  <g transform="translate(225, 192)">
    <rect x="-45" y="-18" width="40" height="18" rx="3" fill="#0284c7"/>
    <text x="-25" y="-5" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">FRL</text>
    <line x1="-5" y1="-9" x2="10" y2="-9" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Technical Spec Tag (Bottom Right) -->
  <rect x="440" y="20" width="144" height="24" rx="4" fill="rgba(255, 255, 255, 0.9)" stroke="#cbd5e1" stroke-width="1"/>
  <text x="512" y="36" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">WRD • MAHARASHTRA</text>
</svg>