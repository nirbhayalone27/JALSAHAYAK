<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="sky-chaskaman" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="60%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="water-chaskaman" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="dam-wall-chaskaman" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="downstream-chaskaman" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow-chaskaman" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="600" height="320" fill="url(#sky-chaskaman)"/>

  <!-- Western Ghats Foothills -->
  <path d="M0,170 Q70,125 150,150 T310,135 T470,145 T600,130 L600,320 L0,320 Z" fill="#94a3b8" opacity="0.35"/>
  <path d="M0,185 Q90,145 200,165 T420,150 T600,160 L600,320 L0,320 Z" fill="#64748b" opacity="0.25"/>

  <!-- Upstream Reservoir Water -->
  <path d="M0,195 Q140,190 270,192 L270,295 L0,295 Z" fill="url(#water-chaskaman)"/>
  <path d="M20,210 Q90,207 180,210" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="12,6" fill="none" opacity="0.6"/>
  <path d="M40,228 Q120,225 220,228" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="16,8" fill="none" opacity="0.5"/>
  <path d="M10,248 Q100,245 240,248" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="20,10" fill="none" opacity="0.4"/>

  <!-- Dam Structure: Earthfill & Masonry Spillway -->
  <polygon points="250,295 268,165 332,165 412,295" fill="url(#dam-wall-chaskaman)" filter="url(#shadow-chaskaman)"/>
  <rect x="264" y="161" width="72" height="8" rx="2" fill="#334155"/>
  <rect x="320" y="169" width="9" height="20" fill="#1e293b"/>
  <rect x="336" y="169" width="9" height="20" fill="#1e293b"/>
  <rect x="352" y="169" width="9" height="20" fill="#1e293b"/>
  <rect x="368" y="169" width="9" height="20" fill="#1e293b"/>
  <path d="M329,181 Q333,185 336,181" stroke="#ef4444" stroke-width="2" fill="none"/>
  <path d="M345,181 Q349,185 352,181" stroke="#ef4444" stroke-width="2" fill="none"/>
  <path d="M361,181 Q365,185 368,181" stroke="#ef4444" stroke-width="2" fill="none"/>
  <line x1="332" y1="165" x2="412" y2="295" stroke="#1e293b" stroke-width="2"/>
  <line x1="342" y1="202" x2="378" y2="202" stroke="#475569" stroke-width="1"/>
  <line x1="358" y1="232" x2="394" y2="232" stroke="#475569" stroke-width="1"/>
  <line x1="372" y1="262" x2="408" y2="262" stroke="#475569" stroke-width="1"/>

  <!-- Downstream River Flow -->
  <path d="M385,290 Q440,285 600,288 L600,320 L360,320 Z" fill="url(#downstream-chaskaman)"/>
  <path d="M400,296 Q480,292 600,296" stroke="#ffffff" stroke-width="2" stroke-dasharray="24,12" fill="none" opacity="0.7"/>

  <!-- Ground Banks -->
  <path d="M0,290 L245,290 L235,320 L0,320 Z" fill="#334155"/>
  <path d="M412,295 L600,295 L600,320 L400,320 Z" fill="#1e293b"/>

  <!-- Glass Info Badge -->
  <rect x="16" y="16" width="320" height="68" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
  <rect x="28" y="26" width="5" height="48" rx="2" fill="#FF9933"/>
  <rect x="28" y="42" width="5" height="16" fill="#FFFFFF"/>
  <rect x="28" y="58" width="5" height="16" fill="#138808"/>
  <text x="42" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Chaskaman Dam</text>
  <text x="42" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Bhima • Pune, Maharashtra</text>
  <text x="42" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Earthfill &amp; Gravity  |  Ht: 46 m  |  Cap: 241 MCM</text>

  <!-- Technical Spec Tag -->
  <rect x="440" y="20" width="144" height="24" rx="4" fill="rgba(255, 255, 255, 0.9)" stroke="#cbd5e1" stroke-width="1"/>
  <text x="512" y="36" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">WRD • MAHARASHTRA</text>
</svg>
